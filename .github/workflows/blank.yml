
name: Bakery Project CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bakery Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required project files
        shell: bash
        run: |
          set -e

          for file in \
            Default.cshtml \
            About.cshtml \
            Order.cshtml \
            OrderSuccess.cshtml \
            Web.config \
            azuredeploy.json
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Diagnose Azure deployment JSON
        shell: bash
        run: |
          echo "Checking azuredeploy.json..."
          if ! python -m json.tool azuredeploy.json > /dev/null; then
            echo "JSON validation failed."
            echo "Showing lines 60-72:"
            nl -ba azuredeploy.json | sed -n '60,72p'
            exit 1
          fi
          echo "azuredeploy.json is valid."

      - name: Check project folders
        shell: bash
        run: |
          set -e
          test -d Content
          test -d Images
          test -d Scripts
          echo "Required project folders exist."

      - name: Validation successful
        run: echo "Bakery project validation passed!"
