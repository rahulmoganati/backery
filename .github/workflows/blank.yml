
name: Bakery Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bakery Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files
        shell: bash
        run: |
          set -e
          for file in \
            Default.cshtml \
            About.cshtml \
            Order.cshtml \
            OrderSuccess.cshtml \
            Web.config \
            azuredeploy.json
          do
            test -f "$file" || {
              echo "Missing file: $file"
              exit 1
            }
            echo "Found: $file"
          done

      - name: Validate JSON
        run: python -m json.tool azuredeploy.json > /dev/null

      - name: Check project directories
        run: |
          test -d Content
          test -d Images
          test -d Scripts
          echo "Bakery project validation passed!"
